<div id="codexion-dongle-game">
  <div class="game-heading">
    <h2>The dongle game</h2>
    <span class="text-small text-muted">A slow-motion learning game</span>
  </div>
  <div class="viz-controls" aria-label="Challenges">
    <button type="button" class="btn" data-level="1" aria-pressed="true">1 · Share</button>
    <button type="button" class="btn" data-level="2" aria-pressed="false">2 · Get stuck</button>
    <button type="button" class="btn" data-level="3" aria-pressed="false">3 · Take turns</button>
  </div>
  <div class="mission"><strong data-title>Make two builds each.</strong><span class="text-small text-muted" data-goal>0 / 8 builds</span></div>
  <div class="viz-controls" data-policy-controls hidden aria-label="Turn-taking rule">
    <button type="button" class="btn" data-policy="fifo" aria-pressed="true">FIFO · first to ask</button>
    <button type="button" class="btn" data-policy="edf" aria-pressed="false">EDF · closest deadline</button>
  </div>
  <div class="arena" aria-label="Four coders sharing four dongles">
    <svg class="connections" aria-hidden="true"></svg>
    <div class="table-clock"><span class="text-small text-muted">Monitor</span><h3 class="tabular-nums" data-time>0 seconds</h3><span class="text-small text-muted" data-center>Watching all clocks</span></div>
    <div data-people></div>
    <div data-tools></div>
  </div>
  <div class="viz-row game-legend text-small text-muted" aria-label="Dongle states"><span><i class="swatch free"></i>Free</span><span><i class="swatch held"></i>In use</span><span><i class="swatch cooling"></i>Cooling for 1 second</span></div>
  <div class="feedback" role="status" aria-live="polite" aria-atomic="true" data-feedback>Tap a coder to give them both tools.</div>
  <div class="viz-controls" aria-label="Game actions">
    <button type="button" class="btn btn-primary" data-tick>Time +1 second</button>
    <button type="button" class="btn btn-primary" data-dispatch hidden>Start FIFO</button>
    <button type="button" class="btn btn-primary" data-fix hidden>Give both together</button>
    <button type="button" class="btn btn-primary" data-next hidden>Next challenge</button>
    <button type="button" class="btn" data-retry>Try again</button>
  </div>
  <div class="cycle text-small text-muted" data-cycle>Compile 2s → debug 1s → refactor 1s → ask again</div>
</div>
<style>
  #codexion-dongle-game { color: var(--foreground); }
  #codexion-dongle-game [hidden] { display: none !important; }
  #codexion-dongle-game .game-heading, #codexion-dongle-game .mission { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  #codexion-dongle-game .game-heading { margin-bottom: 16px; }
  #codexion-dongle-game .mission { margin-top: 18px; margin-bottom: 8px; }
  #codexion-dongle-game .arena { position: relative; width: 100%; max-width: 560px; height: 430px; margin: 0 auto; }
  #codexion-dongle-game .connections { position: absolute; inset: 0; width: 100%; height: 100%; }
  #codexion-dongle-game .table-ring { fill: color-mix(in srgb, var(--muted) 30%, transparent); stroke: var(--border); stroke-width: 1; }
  #codexion-dongle-game .connection { stroke: var(--border); stroke-width: 1.5; }
  #codexion-dongle-game .connection.in-use { stroke: var(--viz-series-1); stroke-width: 2; }
  #codexion-dongle-game .person { position: absolute; transform: translate(-50%, -50%); width: 112px; text-align: center; display: grid; justify-items: center; }
  #codexion-dongle-game .timer { width: 88px; }
  #codexion-dongle-game .person-state { margin-top: 5px; }
  #codexion-dongle-game .tool { position: absolute; transform: translate(-50%, -50%); width: 92px; text-align: center; }
  #codexion-dongle-game .tool-mark { display: inline-block; min-width: 35px; padding: 2px 7px; background: var(--muted); color: var(--foreground); }
  #codexion-dongle-game .tool[data-state="held"] .tool-mark { background: color-mix(in srgb, var(--viz-series-1) 18%, var(--background)); }
  #codexion-dongle-game .tool[data-state="cooling"] .tool-mark { background: color-mix(in srgb, var(--viz-series-2) 20%, var(--background)); }
  #codexion-dongle-game .tool-owner { display: block; margin-top: 3px; }
  #codexion-dongle-game .table-clock { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; width: 128px; }
  #codexion-dongle-game .table-clock h3 { margin: 3px 0; }
  #codexion-dongle-game .game-legend { justify-content: center; margin-bottom: 14px; }
  #codexion-dongle-game .game-legend span { display: inline-flex; align-items: center; gap: 5px; }
  #codexion-dongle-game .swatch { display: inline-block; width: 10px; height: 10px; background: var(--muted); }
  #codexion-dongle-game .swatch.held { background: var(--viz-series-1); }
  #codexion-dongle-game .swatch.cooling { background: var(--viz-series-2); }
  #codexion-dongle-game .feedback { margin: 0 0 14px; min-height: 3em; }
  #codexion-dongle-game .cycle { margin-top: 12px; }
  @media (max-width: 420px) {
    #codexion-dongle-game .arena { height: 390px; }
    #codexion-dongle-game .person { width: 90px; }
    #codexion-dongle-game .timer { width: 74px; }
    #codexion-dongle-game .tool { width: 76px; }
    #codexion-dongle-game .table-clock { width: 102px; }
  }
</style>
<script>
(() => {
  'use strict';
  const names = ['Mia', 'Leo', 'Zoe', 'Sam'];
  const positions = [[50, 14], [83, 50], [50, 86], [17, 50]];
  const toolPositions = [[32, 32], [68, 32], [68, 68], [32, 68]];
  const pair = id => [id, (id + 1) % 4];

  function newGame(level = 1, policy = 'fifo', safe = false) {
    return {
      version: 1, level, policy, safe, time: 0, result: '', running: false,
      goal: level === 1 ? 2 : 1,
      people: names.map((name, id) => ({
        name, id, phase: level === 3 && id > 1 ? 'watching' : 'waiting',
        builds: 0, deadline: level === 3 && id === 1 ? 3 : 8,
        due: null, sequence: id
      })),
      tools: names.map(() => ({ owner: null, readyAt: 0 })),
      message: level === 1 ? 'Tap Mia to give her both tools. Can Zoe work at the same time?'
        : level === 2 ? 'Try the risky rule: tap each coder to take just one tool.'
        : 'Mia asked first. Leo has only 3 seconds left. Pick a rule, then start it.'
    };
  }

  function available(s, id) {
    return pair(id).every(d => s.tools[d].owner === null && s.tools[d].readyAt <= s.time);
  }

  function begin(s, id) {
    const p = s.people[id];
    if (s.result || p.phase !== 'waiting' || !available(s, id) || s.time >= p.deadline) return false;
    pair(id).forEach(d => { s.tools[d].owner = id; });
    p.phase = 'compiling';
    p.deadline = s.time + 8;
    p.due = s.time + 2;
    return true;
  }

  function expired(s) {
    const p = s.people.find(p => !['done', 'watching'].includes(p.phase) && s.time >= p.deadline);
    if (!p) return false;
    p.phase = 'burned';
    s.result = 'burnout';
    s.message = s.level === 3
      ? p.name + ' burned out. FIFO gave Mia the first turn; cooldown kept Leo waiting until his deadline. Try EDF.'
      : p.name + ' ran out of time. The monitor stops everyone. Starting a compile resets that coder’s clock.';
    return true;
  }

  function firstWaiting(s) {
    return s.people.filter(p => p.phase === 'waiting').sort((a, b) =>
      (s.policy === 'edf' ? a.deadline - b.deadline : 0) || a.sequence - b.sequence)[0];
  }

  function schedule(s) {
    const p = firstWaiting(s);
    if (p && begin(s, p.id)) s.message = s.policy.toUpperCase() + ' gives ' + p.name + ' both dongles. Their clock resets to 8 seconds.';
  }

  function takeTurn(s, id) {
    if (s.result || s.level === 3) return;
    const p = s.people[id];
    if (p.phase !== 'waiting') return;
    if (expired(s)) return;
    if (s.level === 2 && !s.safe) {
      const d = s.tools[id];
      if (d.owner !== null || d.readyAt > s.time) return;
      d.owner = id;
      p.phase = 'holding';
      s.message = p.name + ' holds D' + (id + 1) + ', but still needs D' + ((id + 1) % 4 + 1) + '.';
      if (s.people.every(p => p.phase === 'holding')) {
        s.result = 'deadlock';
        s.message = 'Everyone holds one tool and waits for a neighbour’s tool. Nobody can build. This is deadlock!';
      }
      return;
    }
    if (begin(s, id)) {
      s.message = p.name + ' gets both tools and starts compiling. Their countdown resets to 8 seconds.';
      return;
    }
    const blocked = pair(id).find(d => s.tools[d].owner !== null || s.tools[d].readyAt > s.time);
    const d = s.tools[blocked];
    s.message = d.owner !== null
      ? 'D' + (blocked + 1) + ' belongs to ' + names[d.owner] + '. ' + p.name + ' must wait for both tools.'
      : 'D' + (blocked + 1) + ' is cooling until ' + d.readyAt + ' seconds. Released does not mean ready!';
  }

  function tick(s) {
    if (s.result || (s.level === 3 && !s.running)) return;
    s.time++;
    if (expired(s)) return;
    const events = [];
    for (const p of s.people) {
      if (p.due === null || p.due > s.time) continue;
      if (p.phase === 'compiling') {
        pair(p.id).forEach(d => { s.tools[d].owner = null; s.tools[d].readyAt = s.time + 1; });
        p.builds++;
        p.phase = p.builds >= s.goal ? 'done' : 'debugging';
        p.due = p.phase === 'done' ? null : s.time + 1;
        events.push(p.name + ' finishes a build and releases both tools.');
      } else if (p.phase === 'debugging') {
        p.phase = 'refactoring'; p.due = s.time + 1;
        events.push(p.name + ' starts refactoring.');
      } else if (p.phase === 'refactoring') {
        p.phase = 'waiting'; p.due = null;
        events.push(p.name + ' is ready to ask again.');
      }
    }
    if (s.people.every(p => ['done', 'watching'].includes(p.phase))) {
      s.result = 'success';
      s.message = s.level === 1 ? 'You did it! Everybody made two builds. Separate pairs can work together.'
        : s.level === 2 ? 'Nobody got stuck! Giving both tools together removes the one-tool waiting trap.'
        : 'Both made a build! EDF helped Leo before his clock ran out. A scheduler chooses turns; a heap keeps requests in order.';
      return;
    }
    s.message = events.join(' ') || 'All clocks moved forward. A clock resets when compiling starts, not when it finishes.';
    if (s.level === 3 && s.running) schedule(s);
  }

  const root = document.getElementById('codexion-dongle-game');
  const find = selector => root.querySelector(selector);
  const all = selector => [...root.querySelectorAll(selector)];
  let state = newGame();

  function restore(saved) {
    const s = saved?.privateContent?.state;
    if (s?.version !== 1 || ![1, 2, 3].includes(s.level) || !['fifo', 'edf'].includes(s.policy)
      || !Number.isInteger(s.time) || s.time < 0 || !Array.isArray(s.people) || s.people.length !== 4
      || !Array.isArray(s.tools) || s.tools.length !== 4 || typeof s.message !== 'string') return;
    const phases = ['waiting', 'compiling', 'debugging', 'refactoring', 'holding', 'done', 'watching', 'burned'];
    if (!s.people.every((p, i) => p.id === i && phases.includes(p.phase) && Number.isFinite(p.deadline)
      && Number.isInteger(p.builds)) || !s.tools.every(d => (d.owner === null || [0, 1, 2, 3].includes(d.owner))
      && Number.isFinite(d.readyAt))) return;
    state = JSON.parse(JSON.stringify(s));
    state.people.forEach((p, i) => { p.name = names[i]; });
  }

  function save() {
    if (typeof window.openai?.setWidgetState !== 'function') return;
    window.openai.setWidgetState({
      modelContent: { game: 'Codexion', challenge: state.level, rule: state.policy,
        outcome: state.result || 'playing', seconds: state.time,
        builds: state.people.map(p => ({ name: p.name, count: p.builds })) },
      privateContent: { state }
    }).catch(() => {});
  }

  function buildBoard() {
    names.forEach((name, i) => {
      const person = document.createElement('div');
      person.className = 'person'; person.dataset.person = String(i);
      person.style.left = positions[i][0] + '%'; person.style.top = positions[i][1] + '%';
      person.innerHTML = '<button type="button" class="btn" data-coder="' + i + '">' + name + '</button>'
        + '<span class="person-state text-small" data-phase></span>'
        + '<div class="timer"><div class="progress" role="progressbar" aria-label="' + name + ' burnout countdown" aria-valuemin="0" aria-valuemax="8"><div class="progress-bar"></div></div></div>'
        + '<span class="text-small tabular-nums" data-countdown></span><span class="text-small text-muted" data-builds></span>';
      find('[data-people]').append(person);
      const tool = document.createElement('div');
      tool.className = 'tool'; tool.dataset.tool = String(i);
      tool.style.left = toolPositions[i][0] + '%'; tool.style.top = toolPositions[i][1] + '%';
      tool.innerHTML = '<span class="tool-mark">D' + (i + 1) + '</span><span class="tool-owner text-small" data-owner></span>';
      find('[data-tools]').append(tool);
    });
  }

  function drawConnections() {
    const svg = find('.connections');
    const { width, height } = svg.getBoundingClientRect();
    svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
    const point = ([x, y]) => [width * x / 100, height * y / 100];
    let markup = '<ellipse class="table-ring" cx="' + width / 2 + '" cy="' + height / 2 + '" rx="' + width * .28 + '" ry="' + height * .29 + '"/>';
    positions.forEach((p, i) => pair(i).forEach(d => {
      const [x, y] = point(p), [dx, dy] = point(toolPositions[d]);
      markup += '<line class="connection' + (state.tools[d].owner === i ? ' in-use' : '') + '" x1="' + x + '" y1="' + y + '" x2="' + dx + '" y2="' + dy + '"/>';
    }));
    svg.innerHTML = markup;
  }

  function render() {
    const s = state;
    root.dataset.level = String(s.level); root.dataset.result = s.result; root.dataset.time = String(s.time);
    find('[data-title]').textContent = s.level === 1 ? 'Make two builds each.'
      : s.level === 2 ? (s.safe ? 'Try again with both tools together.' : 'What if everyone takes one tool?')
      : 'Who should get the first turn?';
    const active = s.people.filter(p => p.phase !== 'watching');
    find('[data-goal]').textContent = active.reduce((n, p) => n + p.builds, 0) + ' / ' + active.length * s.goal + ' builds';
    find('[data-time]').textContent = s.time + (s.time === 1 ? ' second' : ' seconds');
    find('[data-center]').textContent = s.result === 'deadlock' ? 'Everyone is stuck' : s.result === 'success' ? 'Goal reached!' : s.result === 'burnout' ? 'Game stopped' : 'Watching all clocks';
    all('[data-level]').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.level) === s.level)));
    find('[data-policy-controls]').hidden = s.level !== 3;
    all('[data-policy]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.policy === s.policy)));
    const phases = { waiting: 'Waiting', compiling: 'Compiling', debugging: 'Debugging', refactoring: 'Refactoring', holding: 'Holding one', done: 'Finished!', watching: 'Watching', burned: 'Burned out' };
    for (const p of s.people) {
      const el = find('[data-person="' + p.id + '"]');
      const button = el.querySelector('button');
      button.disabled = Boolean(s.result) || p.phase !== 'waiting' || s.level === 3;
      button.setAttribute('aria-label', s.level === 2 && !s.safe ? 'Let ' + p.name + ' take one tool' : 'Let ' + p.name + ' compile');
      button.setAttribute('aria-pressed', String(['compiling', 'holding'].includes(p.phase)));
      el.querySelector('[data-phase]').textContent = phases[p.phase];
      const retired = ['done', 'watching'].includes(p.phase);
      const remaining = Math.max(0, p.deadline - s.time);
      el.querySelector('[data-countdown]').textContent = retired ? 'Clock off' : remaining + 's left';
      const progress = el.querySelector('[role="progressbar"]');
      progress.hidden = retired;
      progress.setAttribute('aria-valuenow', String(Math.min(8, remaining)));
      progress.setAttribute('aria-valuetext', remaining + ' seconds until burnout');
      el.querySelector('.progress-bar').style.width = Math.min(100, remaining / 8 * 100) + '%';
      el.querySelector('[data-builds]').textContent = p.phase === 'watching' ? '' : p.builds + '/' + s.goal + ' builds';
    }
    s.tools.forEach((d, i) => {
      const el = find('[data-tool="' + i + '"]');
      el.dataset.state = d.owner !== null ? 'held' : d.readyAt > s.time ? 'cooling' : 'free';
      el.querySelector('[data-owner]').textContent = d.owner !== null ? names[d.owner] : d.readyAt > s.time ? 'Cooling' : 'Free';
    });
    find('[data-feedback]').textContent = s.message;
    const play = !s.result;
    find('[data-tick]').hidden = !play || (s.level === 3 && !s.running);
    find('[data-dispatch]').hidden = s.level !== 3 || s.running || !play;
    find('[data-dispatch]').textContent = 'Start ' + s.policy.toUpperCase();
    find('[data-fix]').hidden = s.result !== 'deadlock';
    find('[data-next]').hidden = s.result !== 'success';
    find('[data-next]').textContent = s.level === 3 ? 'Play from the beginning' : 'Next challenge';
    find('[data-retry]').textContent = s.level === 3 && s.result === 'burnout' ? 'Try EDF' : 'Try again';
    find('[data-cycle]').textContent = s.level === 3 ? 'Only Mia and Leo need one build here. Zoe and Sam are watching.' : 'Compile 2s → debug 1s → refactor 1s → ask again';
    drawConnections();
  }

  root.addEventListener('click', event => {
    const button = event.target.closest('button');
    if (!button || !root.contains(button) || button.disabled) return;
    if (button.dataset.level) state = newGame(Number(button.dataset.level));
    else if (button.dataset.policy) state = newGame(3, button.dataset.policy);
    else if (button.dataset.coder !== undefined) takeTurn(state, Number(button.dataset.coder));
    else if (button.hasAttribute('data-tick')) tick(state);
    else if (button.hasAttribute('data-dispatch')) { state.running = true; schedule(state); }
    else if (button.hasAttribute('data-fix')) { state = newGame(2, 'fifo', true); state.message = 'Now take a complete pair. The neighbours wait without holding a tool.'; }
    else if (button.hasAttribute('data-next')) state = newGame(state.level === 3 ? 1 : state.level + 1);
    else if (button.hasAttribute('data-retry')) state = newGame(state.level, state.level === 3 && state.result === 'burnout' ? 'edf' : state.policy, state.safe);
    render(); save();
  });
  window.addEventListener('openai:set_globals', event => {
    if (event.detail?.globals?.widgetState) { restore(event.detail.globals.widgetState); render(); }
  });
  restore(window.openai?.widgetState);
  buildBoard(); render();
  new ResizeObserver(drawConnections).observe(find('.arena'));
})();
</script>
