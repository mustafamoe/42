[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Schema-constrained function calling with Qwen3-0.6B"
requires-python = ">=3.10,<3.11"
dependencies = [
    "llm-sdk",
    "numpy>=2.0,<3",
    "pydantic>=2.10,<3",
    "transformers>=4.51,<5",
    "accelerate>=1.2,<2",
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk" }

[dependency-groups]
dev = ["flake8>=7,<8", "mypy>=1.15,<2"]

[tool.mypy]
python_version = "3.10"
exclude = ["^llm_sdk/", "^\\.venv/"]

[[tool.mypy.overrides]]
module = "llm_sdk"
follow_imports = "skip"
