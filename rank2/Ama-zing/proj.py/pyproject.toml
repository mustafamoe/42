
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
 
[project]
name = "mazegen"
version = "0.1.0"
description = "Reusable maze generator using the recursive backtracker algorithm."
requires-python = ">=3.10"
authors = [
    { name = "sahamad" }, 
    { name = "team-member" },
]
 
[tool.setuptools]
py-modules = ["mazegen"]
 